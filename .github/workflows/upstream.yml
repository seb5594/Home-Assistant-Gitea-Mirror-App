name: Follow upstream releases

# A new release of the packaged software becomes a new version of the app by itself:
# the engine script changes the pin in the Dockerfile and raises the app version
# (see .scripts/upstream.py in the engine), then explicitly starts the release pipeline.

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
  pull_request:
    branches: [dev, main]

permissions:
  contents: write
  actions: write

jobs:
  follow:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Repository writes use the scoped workflow token; the PAT only reads the engine.
          token: ${{ github.token }}
      - uses: actions/checkout@v7
        with:
          repository: seb5594/hass-workflows
          ref: 1451964783bbc3d843cad7bd2f28ccb74223f166
          token: ${{ secrets.ORCHESTRATION_PAT }}
          path: .engine
          persist-credentials: false
      - id: upstream
        run: python3 .engine/.scripts/upstream.py update
      - name: Commit the new version
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.upstream.outputs.version }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!.engine'
          git commit -m "Update upstream to release $VERSION"
          git push
          # Pushes with GITHUB_TOKEN do not trigger push workflows; dispatch does.
          gh workflow run ci.yml --ref "$TARGET_BRANCH"

  renovate:
    # Renovate raises base image and package pins; each such pull request also needs a new app version.
    if: github.event_name == 'pull_request' && github.actor == 'renovate[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/checkout@v7
        with:
          repository: seb5594/hass-workflows
          ref: 1451964783bbc3d843cad7bd2f28ccb74223f166
          token: ${{ secrets.ORCHESTRATION_PAT }}
          path: .engine
          persist-credentials: false
      - id: bump
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 .engine/.scripts/upstream.py bump "Dependencies: ${TITLE#chore(deps): }." --base "origin/${{ github.base_ref }}"
      - name: Commit the new version
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!.engine'
          git commit -m "Raise the app version to $VERSION"
          git push
          gh workflow run ci.yml --ref "$TARGET_BRANCH"
